[project]
name = "inforce"
version = "0.1.0"
description = "Find every AI answer, line of code and document that still runs on repealed law. Built with Relate."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "relate-db==1.3.0",   # pinned exactly; matches the relate CLI v1.3.0 (spike 2026-11-25)
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "mcp>=1.0",           # Python MCP SDK for `inforce serve`
]

[project.optional-dependencies]
embed = ["model2vec>=0.3"]   # local CPU embeddings for `ask`; demo vectors are precomputed
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
inforce = "inforce.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["inforce*"]

[tool.setuptools.package-data]
inforce = ["queries/*.cypher"]
