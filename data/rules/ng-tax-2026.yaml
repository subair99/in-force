  - {akn: akn/ng/act/2025/7/sec_56, instrument: akn/ng/act/2025/7, numbers: {gazetted: {number: "56", page: A428}, certified: {number: "56"}}, summary: "Company income tax rate.", validFrom: 2026-01-01, source: nta-text, secondarySource: chambers-cit-2026, verified: false}
