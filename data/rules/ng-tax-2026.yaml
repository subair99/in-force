  - {by: akn/ng/act/2025/7, target: TODO/ng/act/pita,   on: 2026-01-01, byProvision: akn/ng/act/2025/7/sec_195, source: nta-certified, secondarySource: [nta-text, chambers-cit-2026], verified: false}
  - {by: akn/ng/act/2025/7, target: TODO/ng/act/cita,   on: 2026-01-01, byProvision: akn/ng/act/2025/7/sec_195, source: nta-certified, secondarySource: [nta-text, chambers-cit-2026], verified: false}
  - {by: akn/ng/act/2025/7, target: TODO/ng/act/cgta,   on: 2026-01-01, byProvision: akn/ng/act/2025/7/sec_195, source: nta-certified, secondarySource: [nta-text, chambers-cit-2026], verified: false}
  - {by: akn/ng/act/2025/7, target: TODO/ng/act/vata,   on: 2026-01-01, byProvision: akn/ng/act/2025/7/sec_195, source: nta-certified, secondarySource: [nta-text, chambers-cit-2026], verified: false}
  - {by: akn/ng/act/2025/7, target: TODO/ng/act/iditra, on: 2026-01-01, byProvision: akn/ng/act/2025/7/sec_195, source: nta-certified, secondarySource: [nta-text, chambers-cit-2026], verified: false}
