# InForce law pack: Nigeria tax reform (seed)
#
# EVERY entry is verified: false. Values come from secondary commentary
# (PwC, Chambers, KPMG, Mondaq, BusinessDay) and MUST be checked by a human
# against the Act's text before verified is set to true.
# Claude Code: do not edit values or flip `verified`. Add TODO comments instead.
# Store summaries in our own words only. Never paste section text.

sources:
  - id: pwc-individual
    url: https://taxsummaries.pwc.com/nigeria/individual
    kind: commentary
  - id: pwc-individual-dev
    url: https://taxsummaries.pwc.com/nigeria/individual/significant-developments
    kind: commentary
  - id: chambers-cit-2026
    url: https://chambers.com/practice-guides/guides/corporate-tax-2026/nigeria/trends-and-developments
    kind: commentary
  - id: kpmg-certified
    url: https://kpmg.com/us/en/taxnewsflash/news/2026/01/tnf-nigeria-certified-versions-of-tax-reform-legislation-released-by-national-assembly.html
    kind: commentary
  - id: mondaq-nta-analysis
    url: https://www.mondaq.com/nigeria/tax-authorities/1691528/beyond-the-news-a-deep-dive-into-the-nigeria-tax-laws-policy-analysis-of-the-2025-tax-reform-acts-part-1
    kind: commentary
  - id: businessday-pit
    url: https://businessday.ng/?p=1096473
    kind: commentary
  - id: kpmg-pit
    url: https://assets.kpmg.com/content/dam/kpmgsites/xx/pdf/2025/09/fa25-168.pdf.coredownload.inline.pdf
    kind: commentary
  - id: nta-text            # page numbers (A417, A492, A502) and the Fourth Schedule refer to this file
    url: https://www.nrs.gov.ng/uploads/NIGERIA_TAX_ACT_2025_ef6bb812a5.pdf
    kind: act
    title: "Nigeria Tax Act, 2025 — gazetted copy (Official Gazette No. 117, 26 June 2025, Government Notice No. 26, Act No. 7), published by the Nigeria Revenue Service"
    citation: "Nigeria Tax Act, 2025 — gazetted copy (Official Gazette No. 117, 26 June 2025, Government Notice No. 26, Act No. 7), published by the Nigeria Revenue Service"
  - id: nta-certified       # certified edition: section numbers s.182(2), s.195, s.202 and the long-title bracket
    url: https://tat.gov.ng/NIGERIA-TAX-ADMINISTRATION-ACT-2025.pdf
    kind: act
    title: "Nigeria Tax Act, 2025 — approved copy for print (Act No. 7, pp. A387–A596), hosted by the Tax Appeal Tribunal"
    note: "the file name says Tax Administration Act, but the content is the Nigeria Tax Act; checked 26 Nov 2026"
  - id: ntaa-text
    url: https://gazettengr.com/wp-content/uploads/NIGERIA-TAX-ADMINISTRATION-ACT-2025.pdf
    kind: act
    title: "Nigeria Tax Administration Act, 2025 (Official Gazette No. 117, Government Notice No. 24, Act No. 5)"
  - id: nrsa-text
    url: https://media.premiumtimesng.com/wp-content/files/2026/01/Approved-Copy-to-Print.-Nigeria-Revenue-Service-Establishment-Act-2025-1.pdf.pdf
    kind: act
    title: "Nigeria Revenue Service (Establishment) Act, 2025 (approved-to-print copy, Jan 2026)"
  - id: jrba-text
    url: https://media.premiumtimesng.com/wp-content/files/2026/01/Approved-Copy-to-Print-Joint-Revenue-Board-of-Nigeria-Establishment-Act-2025-B.pdf
    kind: act
    title: "Official Gazette No. 117, 26 June 2025, Government Notice No. 25, Act No. 6, pp. A349–382 (approved copy to print)"
  - id: thecable-gazettes
    url: https://www.thecable.ng/fg-gazettes-tax-reform-laws-implementation-to-begin-january-2026
    kind: commentary
  - id: kpmg-gaps-2026
    url: https://kpmg.com/ng/en/home/insights/2026/01/nigeria-new-tax-laws-inherent-errors-inconsistencies-gaps-and-omissions.html
    kind: commentary

instruments:
  - akn: akn/ng/act/2025/7          # id format as used by judy.legal; confirm
    short: NTA
    title: Nigeria Tax Act, 2025
    kind: act
    assentedOn: 2025-06-26
    commencesOn: 2026-01-01
    source: nta-text
    secondarySource: thecable-gazettes
    versions:
      - {version: gazetted, recordedAt: 2025-06-26, closedAt: 2026-01-06, source: nta-text, note: "Official Gazette No. 117 dated 26 Jun 2025; publication announced by the Presidency on 6 Sep 2025 (Bloomberg Tax)"}
      - {version: certified, recordedAt: 2026-01-06, source: nta-certified, note: "approved copy for print (pp. A387–A596), released Jan 2026; 6 Jan 2026 is the date KPMG reported the release (kpmg-certified), which gives no release day"}
  - akn: TODO/ng/act/pita
    short: PITA
    title: Personal Income Tax Act
    kind: act
  - akn: TODO/ng/act/cita
    short: CITA
    title: Companies Income Tax Act
    kind: act
  - akn: TODO/ng/act/cgta
    short: CGTA
    title: Capital Gains Tax Act
    kind: act
  - akn: TODO/ng/act/vata
    short: VAT Act
    title: Value Added Tax Act
    kind: act
  - akn: TODO/ng/act/iditra
    short: IDITRA
    title: Industrial Development (Income Tax Relief) Act
    kind: act
  # The other three reform Acts, enacted with the NTA on 26 June 2025 (commencement dates only).
  - akn: TODO/ng/act/2025/ntaa
    short: NTAA
    title: Nigeria Tax Administration Act
    kind: act
    assentedOn: 2025-06-26
    commencesOn: 2026-01-01           # per the official announcement
    commencementSection: "long title (Commencement)"
    source: ntaa-text                 # do not use the uploaded "FINAL COPY": it is the pre-assent bill
    page: A265
    note: "gazetted bracket reportedly reads 26 Jun 2025 (text extraction, not yet visually confirmed)"
    secondarySource: thecable-gazettes
    verified: false
  # NRS and JRB Acts: effective 26 Jun 2025, activated 1 Jan 2026 (see kpmg-gaps-2026)
  - akn: TODO/ng/act/2025/nrsa
    short: NRS Act
    title: Nigeria Revenue Service (Establishment) Act
    kind: act
    assentedOn: 2025-06-26
    commencesOn: 2025-06-26
    source: nrsa-text
    secondarySource: [thecable-gazettes, kpmg-gaps-2026]
    verified: false
  - akn: TODO/ng/act/2025/jrba
    short: JRB Act
    title: Joint Revenue Board of Nigeria (Establishment) Act
    kind: act
    assentedOn: 2025-06-26
    commencesOn: 2025-06-26
    source: jrba-text
    secondarySource: [thecable-gazettes, kpmg-gaps-2026]
    verified: false

