replacements:   # Rule -> Rule: a true one-to-one successor only
  # No band-to-band links: the old and new PIT scales cover different income ranges
  # (see successions: the scale is replaced as a whole).
  # No CRA link: the CRA was dropped, not replaced (see related:).
  - {old: ng.cgt.company.old, new: ng.cgt.company.2026}

successions:   # Provision -> Provision: an old section replaced as a whole by a new one
  - {old: TODO/ng/act/pita/sec_bands, new: akn/ng/act/2025/7/sec_58, note: "whole PIT scale: the old 6-band scale replaced by the new scale", source: pwc-individual, verified: false}

related:   # Rule -> Rule: worth reading together, NOT a successor (the old rule ended with no replacement)
