# scan patterns: code and document text -> Rule ids (deterministic, reviewable)
# Each match creates (:Artifact)-[:ENCODES]->(:Rule). Keep patterns explicit;
# false positives are worse than misses for a legal tool.

constants:
  - name_regex: '^CRA(_|$)'            # CRA_RATE, CRA_FLAT_MIN ...
    rule: ng.pit.cra.old
  - name_regex: '^(PIT|PAYE)_BANDS?(_\d{4})?$'
    value_contains: [300000, 0.07]      # band tuple with the old first band
    rule: ng.pit.band1.old
  - name_regex: '^(PIT|PAYE)_BANDS?(_\d{4})?$'
    value_contains: [300000, 0.11]
    rule: ng.pit.band2.old
  - name_regex: 'CGT_RATE'
    value_equals: 0.10
    rule: ng.cgt.company.old
  # 2026 rules, so fixed code links to the law it now follows
  - name_regex: '^(PIT|PAYE)_BANDS?(_\d{4})?$'
    value_contains: [800000, 0.0]
    rule: ng.pit.band1.2026
  - name_regex: '^(PIT|PAYE)_BANDS?(_\d{4})?$'
    value_contains: [2200000, 0.15]
    rule: ng.pit.band2.2026
  - name_regex: '^RENT_RELIEF'
    rule: ng.pit.rent_relief.2026
  - name_regex: '^(CIT|COMPANY_TAX)_RATE$'
    value_equals: 0.30
    rule: ng.cgt.company.2026

# Documents, templates and answers are read with the same patterns as `inforce check`
# (patterns/ng-citations.yaml), so a citation means the same thing everywhere.

# Artifact kind by path; the first matching kind wins, in this order.
file_globs:
  test: ['tests/**/*.py', '**/test_*.py']
  code: ['**/*.py']
  answer: ['answers/**/*.md']
  template: ['**/*.html']
  doc: ['**/*.md', '**/*.txt']
  ignore: ['.inforce/**', '.git/**', '**/__pycache__/**', '.venv/**', 'README.md']
